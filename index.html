* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: "AnthropicSerif", Georgia, serif;
  font-style: italic;
  font-weight: 300;
  background: #f5f4ef;
  color: #222;
  padding: 24px 12px;
}
.wrap { max-width: 520px; margin: 0 auto; }
h1 { text-align: center; font-weight: 300; margin: 0 0 20px; }
.card { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 14px; margin-bottom: 14px; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; }
input[type=range] { flex: 1; }
select { padding: 4px; font: inherit; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; margin-bottom: 12px; }
.check { display: block; font-size: 14px; }
.out {
  font-family: monospace;
  font-style: normal;
  font-size: 15px;
  background: #fafafa;
  border: 1px solid #eee;
  border-radius: 4px;
  padding: 10px;
  min-height: 40px;
  word-break: break-all;
  margin-bottom: 10px;
}
.btns { display: flex; gap: 8px; }
button {
  font: inherit;
  padding: 7px 12px;
  border: 1px solid #888;
  background: #fff;
  border-radius: 4px;
  cursor: pointer;
}
button:active { background: #eee; }
.btns button { flex: 1; }
.all { display: block; width: 100%; padding: 10px; background: #222; color: #fff; border-color: #222; }
.toast { text-align: center; min-height: 1.2em; font-size: 14px; }

.footer { text-align: center; font-size: 13px; color: #777; margin-top: 18px; }
.footer p { margin: 4px 0; }

.top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 10px; }
.top h1 { margin: 0; }
.top select { padding: 4px; font: inherit; }

</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <h1 data-i18n="title">Random Generator</h1>
    <select id="lang" aria-label="Language">
      <option value="vi">Tiếng Việt</option>
      <option value="en">English</option>
      <option value="ru">Русский</option>
    </select>
  </div>
  <section class="card">
    <div class="row">
      <label><span data-i18n="len">Độ dài mật khẩu</span>: <span id="lenVal">16</span></label>
      <input type="range" id="len" min="4" max="64" value="16">
    </div>
    <div class="opts">
      <label class="check"><input type="checkbox" id="s-sym" checked> <span data-i18n="sym">Allow Symbols (!@#$%^&amp;*()+)</span></label>
      <label class="check"><input type="checkbox" id="s-num" checked> <span data-i18n="num">Allow Numbers (0-9)</span></label>
      <label class="check"><input type="checkbox" id="s-low" checked> <span data-i18n="low">Allow Lowercase (abc)</span></label>
      <label class="check"><input type="checkbox" id="s-up" checked> <span data-i18n="up">Allow Uppercase (ABC)</span></label>
      <label class="check"><input type="checkbox" id="s-other"> <span data-i18n="other">Allow Other Symbols (~`[];?,)</span></label>
      <label class="check"><input type="checkbox" id="s-dup"> <span data-i18n="dup">Exclude Duplicate Characters</span></label>
      <label class="check"><input type="checkbox" id="s-sim"> <span data-i18n="sim">Exclude Similar (iI1loO0)</span></label>
    </div>
    <div class="out" id="pass">—</div>
    <div class="btns">
      <button data-gen="pass" data-i18n="genPass">Gen mật khẩu</button>
      <button data-copy="pass" data-i18n="copy">Copy</button>
    </div>
  </section>

  <section class="card">
    <div class="row">
      <label data-i18n="domain">Domain:</label>
      <select id="domain">
        <option>gmail.com</option>
        <option>yahoo.com</option>
        <option>outlook.com</option>
        <option>proton.me</option>
      </select>
    </div>
    <div class="out" id="email">—</div>
    <div class="btns">
      <button data-gen="email" data-i18n="genEmail">Gen email</button>
      <button data-copy="email" data-i18n="copy">Copy</button>
    </div>
  </section>

  <section class="card">
    <div class="out" id="name">—</div>
    <div class="btns">
      <button data-gen="name" data-i18n="genName">Gen họ tên</button>
      <button data-copy="name" data-i18n="copy">Copy</button>
    </div>
  </section>

  <button class="all" data-gen="all" data-i18n="genAll">Gen tất cả</button>
  <p class="toast" id="toast"></p>
</main>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const rand = (n) => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; };
  const pick = (arr) => arr[rand(arr.length)];

  const T = {
    vi: {
      title: "Random Generator", len: "Độ dài mật khẩu", sym: "Allow Symbols (!@#$%^&*()+)",
      num: "Allow Numbers (0-9)", low: "Allow Lowercase (abc)", up: "Allow Uppercase (ABC)",
      other: "Allow Other Symbols (~`[];?,)", dup: "Exclude Duplicate Characters",
      sim: "Exclude Similar (iI1loO0)", domain: "Domain:", genPass: "Gen mật khẩu", genEmail: "Gen email",
      genName: "Gen họ tên", genAll: "Gen tất cả", copy: "Copy",
      copied: "Đã copy", copyFail: "Copy thất bại", needOne: "Chọn ít nhất 1 loại ký tự",
      noChars: "Không còn ký tự nào", tooLong: "Độ dài vượt số ký tự khác nhau ({n})"
    },
    en: {
      title: "Random Generator", len: "Password length", sym: "Allow Symbols (!@#$%^&*()+)",
      num: "Allow Numbers (0-9)", low: "Allow Lowercase (abc)", up: "Allow Uppercase (ABC)",
      other: "Allow Other Symbols (~`[];?,)", dup: "Exclude Duplicate Characters",
      sim: "Exclude Similar (iI1loO0)", domain: "Domain:", genPass: "Gen password", genEmail: "Gen email",
      genName: "Gen full name", genAll: "Gen all", copy: "Copy",
      copied: "Copied", copyFail: "Copy failed", needOne: "Select at least 1 character type",
      noChars: "No characters left", tooLong: "Length exceeds unique characters ({n})"
    },
    ru: {
      title: "Генератор случайных данных", len: "Длина пароля", sym: "Символы (!@#$%^&*()+)",
      num: "Цифры (0-9)", low: "Строчные (abc)", up: "Заглавные (ABC)",
      other: "Прочие символы (~`[];?,)", dup: "Без повторов",
      sim: "Исключить похожие (iI1loO0)", domain: "Домен:", genPass: "Сгенерировать пароль",
      genEmail: "Сгенерировать email", genName: "Сгенерировать ФИО", genAll: "Сгенерировать всё",
      copy: "Копировать", copied: "Скопировано", copyFail: "Ошибка копирования",
      needOne: "Выберите хотя бы один тип символов", noChars: "Не осталось символов",
      tooLong: "Длина превышает число уникальных символов ({n})"
    }
  };

  const NAMES = {
    vi: {
      last: ["Nguyễn","Trần","Lê","Phạm","Hoàng","Huỳnh","Phan","Vũ","Võ","Đặng","Bùi","Đỗ","Hồ","Ngô","Dương","Lý","Đinh","Đoàn","Vương","Trương","Mai","Tô","Lưu","Chu","Đào","Cao","Hà","Kiều","Lâm","Tạ","Quách","Tăng","Thái","Từ","Đàm","Mạc","Hứa","Khương","Thạch","Ông"],
      mid: ["Văn","Thị","Minh","Quốc","Hữu","Thanh","Ngọc","Gia","Anh","Đức","Bảo","Công","Xuân","Thu","Khánh","Mỹ","Thùy","Diệu","Hải","Đình","Tuấn","Kim","Phương","Thế","Trọng","Hoài","Như","Tường","Thiên","Ánh","Đăng","Quang","Hồng","Bích","Thảo","Tú","Phi"],
      first: ["An","Bình","Châu","Dũng","Hà","Hương","Khoa","Linh","Nam","Phúc","Quân","Tâm","Thảo","Trang","Tuấn","Vy","Yến","Huy","Long","Hiếu","Nhi","Ngân","Hạnh","Lan","Mai","Oanh","Phát","Sơn","Tú","Việt","Vinh","Khang","Đạt","Hòa","Kiên","My","Nga","Quỳnh","Thư","Uyên","Bách","Cường","Đăng","Giang","Hân","Khải","Lộc","Nghĩa","Phong","Thắng","Tiến","Trí","Hải","Duy","Hoa","Loan","Ly","Mạnh","Đông","Nhật","Gia Bảo","Minh Anh","Bảo Ngọc","Khánh Vy"],
      order: ["last", "mid", "first"]
    },
    en: {
      last: ["Smith","Johnson","Williams","Brown","Jones","Garcia","Miller","Davis","Rodriguez","Martinez","Hernandez","Lopez","Wilson","Anderson","Thomas","Taylor","Moore","Jackson","Martin","Lee","Thompson","White","Harris","Clark","Lewis","Robinson","Walker","Young","Allen","King","Wright","Scott","Hill","Green","Adams","Baker","Nelson","Carter","Mitchell","Turner"],
      mid: ["James","Michael","Grace","Lee","Ann","Marie","Ray","Jay","Lynn","Paul","Rose","Kay","Jean","Dale","Joe","Lou","Mae","Ruth","Alan","Glen","Dean","Eve","Vera","Owen","Neil"],
      first: ["Emma","Liam","Olivia","Noah","Ava","Ethan","Sophia","Mason","Mia","Logan","Lucas","Amelia","Harper","Aiden","Elena","Leo","Chloe","Jack","Zoe","Ryan","Nora","Owen","Hazel","Ian","Maya","Eli","Ivy","Felix","Luna","Oscar","Iris","Hugo","Sara","Adam","Lily","Isaac","Clara","Ben","Ruby","Max"],
      order: ["first", "mid", "last"]
    },
    ru: {
      last: ["Иванов","Смирнов","Кузнецов","Попов","Васильев","Петров","Соколов","Михайлов","Новиков","Фёдоров","Морозов","Волков","Алексеев","Лебедев","Семёнов","Егоров","Павлов","Козлов","Степанов","Николаев","Орлов","Андреев","Макаров","Никитин","Захаров","Зайцев","Соловьёв","Борисов","Яковлев","Григорьев"],
      mid: ["Александрович","Дмитриевич","Максимович","Сергеевич","Андреевич","Алексеевич","Иванович","Михайлович","Николаевич","Владимирович","Евгеньевич","Олегович","Игоревич","Артёмович","Павлович","Романович","Вадимович","Тимурович","Анатольевич","Викторович","Александровна","Дмитриевна","Максимовна","Сергеевна","Андреевна","Алексеевна","Ивановна","Михайловна","Николаевна","Владимировна","Евгеньевна","Олеговна","Игоревна","Артёмовна","Павловна","Романовна","Вадимовна","Анатольевна","Викторовна"],
      first: ["Александр","Дмитрий","Максим","Сергей","Андрей","Алексей","Иван","Михаил","Никита","Артём","Егор","Илья","Кирилл","Павел","Роман","Владимир","Евгений","Олег","Денис","Тимур","Анна","Мария","Елена","Ольга","Наталья","Татьяна","Ирина","Екатерина","Ксения","Дарья","Анастасия","Юлия","Виктория","Полина","Светлана","Людмила","Алина","Вера"],
      order: ["last", "first", "mid"]
    }
  };
<!-- Cách Làm súng tại nhà  -->
  const SETS = { sym: "!@#$%^&*()+", num: "0123456789", low: "abcdefghijklmnopqrstuvwxyz", up: "ABCDEFGHIJKLMNOPQRSTUVWXYZ", other: "~`[];?," };
  const SIMILAR = "iI1loO0";
  let lang = "vi";

  const tr = (key, n) => {
    const s = (T[lang] && T[lang][key]) || T.vi[key] || key;
    return n === undefined ? s : s.replace("{n}", n);
  };

  const toast = (msg) => {
    $("toast").textContent = msg;
    clearTimeout(toast.t);
    toast.t = setTimeout(() => ($("toast").textContent = ""), 1200);
  };

  const shuffle = (a) => {
    for (let i = a.length - 1; i > 0; i--) {
      const j = rand(i + 1);
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };

  const genPass = () => {
    const len = +$("len").value;
    const on = (k) => $("s-" + k).checked;

    let groups = Object.keys(SETS).filter(on).map((k) => SETS[k]);
    if (!groups.length) { toast(tr("needOne")); return ""; }

    if (on("sim")) {
      groups = groups.map((g) => [...g].filter((c) => !SIMILAR.includes(c)).join("")).filter((g) => g);
    }
    if (!groups.length) { toast(tr("noChars")); return ""; }

    const pool = [...new Set(groups.join(""))];

    if (on("dup")) {
      if (len > pool.length) { toast(tr("tooLong", pool.length)); return ""; }
      return shuffle(pool).slice(0, len).join("");
    }
<!-- cách làm CS2 Wallhack -->
    const out = groups.length <= len ? groups.map((g) => pick([...g])) : [];
    while (out.length < len) out.push(pick(pool));
    return shuffle(out).join("");
  };

  const genEmailUser = () => {
    const pool = "abcdefghijklmnopqrstuvwxyz0123456789";
    let s = "";
    for (let i = 0, n = 8 + rand(7); i < n; i++) s += pick([...pool]);
    return s;
  };
  const genName = () => {
    const d = NAMES[lang] || NAMES.vi;
    const picked = {};
    d.order.forEach((k) => (picked[k] = pick(d[k])));
    const keys = rand(3) === 0 ? d.order.filter((k) => k !== "mid") : d.order;
    return keys.map((k) => picked[k]).join(" ");
  };

  const set = (id, v) => ($(id).textContent = v);

  const actions = {
    pass: () => set("pass", genPass()),
    name: () => set("name", genName()),
    email: () => set("email", genEmailUser() + "@" + $("domain").value),
    all: () => { actions.name(); actions.email(); actions.pass(); }
  };

  const applyLang = () => {
    document.documentElement.lang = lang;
    document.title = tr("title");
    document.querySelectorAll("[data-i18n]").forEach((el) => (el.textContent = tr(el.dataset.i18n)));
  };

  document.querySelectorAll("[data-gen]").forEach((b) =>
    b.addEventListener("click", () => actions[b.dataset.gen]())
  );

  document.querySelectorAll("[data-copy]").forEach((b) =>
    b.addEventListener("click", async () => {
      const txt = $(b.dataset.copy).textContent;
      if (!txt || txt === "—") return;
      try { await navigator.clipboard.writeText(txt); toast(tr("copied")); }
      catch { toast(tr("copyFail")); }
    })
  );
<!-- Cách Jailbreak Chatgpt hoặc các AI khác --> 
  $("len").addEventListener("input", () => set("lenVal", $("len").value));
  $("lang").addEventListener("change", (e) => { lang = e.target.value; applyLang(); });

  applyLang();
  actions.all();
})();

</script>
</body>
</html>
